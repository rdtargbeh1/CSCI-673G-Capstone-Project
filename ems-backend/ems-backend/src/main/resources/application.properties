spring.application.name=ems-backend


# ================================================================
# SERVER
# ================================================================

#server.port=8081


# ================================================================
# POSTGRESQL DATASOURCE
# ================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/election_app_ems
spring.datasource.username=postgres
spring.datasource.password=romelta2
spring.datasource.driver-class-name=org.postgresql.Driver


# ================================================================
# DATASOURCE MODE
# ================================================================

# Local development currently uses the standard Spring Boot DataSource.
# Enable tenant-aware datasource only when the production configuration
# is ready for it.
app.datasource.tenant-aware=false


# ================================================================
# JPA / HIBERNATE
# ================================================================

# Database schema is managed manually through SQL scripts.
spring.jpa.hibernate.ddl-auto=none

# Development SQL visibility.
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn


# ================================================================
# SECURITY / JWT
# ================================================================

app.security.issuer=https://vote-tracker.local

# TokenService defaults to 3600 when this property is omitted,
# but keeping it explicit makes the local configuration clearer.
app.security.access-token-ttl=3600


# ================================================================
# AWS KMS SIGNING
# ================================================================

# Used by SigningServiceAwsKms.
#
# Local development can use the placeholder key ID when AWS KMS
# signing is not actually being invoked.
#
# Production must supply a real AWS KMS key ID or ARN.
app.security.kms.key-id=local-dev-key-id
app.security.kms.algorithm=RSASSA_PSS_SHA_256


# ================================================================
# GENERAL FILE STORAGE
# ================================================================

# General application files:
# - Party logos
# - Candidate photos
# - Organization logos
# - User profile images
# - Submission attachments
# - Other FileUpload-backed resources
#
# Supported providers:
#
# local
# s3
#
# Use local during development.
app.storage.provider=local


# ================================================================
# GENERAL FILE STORAGE - S3
# ================================================================

# Used only when:
#
# app.storage.provider=s3
#
# Do not commit real production credentials.
app.storage.bucket=your-bucket-name-here
app.storage.prefix=election-vote-tracker


# ================================================================
# SPRING SECURITY LOGGING
# ================================================================

# Useful during development.
# Change to INFO or remove in production.
logging.level.org.springframework.security=DEBUG


# ================================================================
# THYMELEAF
# ================================================================

# Disable template caching during development.
spring.thymeleaf.cache=false


# ================================================================
# REPORT STORAGE
# ================================================================

# Generated reports use their own storage provider.
#
# Local development:
#     filesystem
#
# Production:
#     s3
reports.storage=filesystem


# ================================================================
# REPORT STORAGE - LOCAL FILESYSTEM
# ================================================================

reports.filesystem.path=./data/reports


# ================================================================
# REPORT PDF DEFAULTS
# ================================================================

reports.pdf.topN=10
reports.pdf.sampleSize=20


# ================================================================
# REPORT STORAGE - S3
# ================================================================

# These values are inactive while:
#
# reports.storage=filesystem
#
# Supply production values through environment variables or
# application-prod.properties.

reports.s3.endpoint=
reports.s3.region=us-east-1
reports.s3.accessKey=
reports.s3.secretKey=
reports.s3.bucket=
reports.s3.basePath=reports
reports.s3.presign.ttl=86400


# ================================================================
# PRODUCTION EXAMPLE
# ================================================================

# Prefer application-prod.properties and environment variables.
#
