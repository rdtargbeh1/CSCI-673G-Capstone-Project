spring.application.name=ems-backend



server.port=8081

# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/election_app_ems
spring.datasource.username=postgres
spring.datasource.password=romelta2

# Set to true for production
app.datasource.tenant-aware=false

# Optional (Boot usually detects it)
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# we?ll run your SQL ourselves
spring.jpa.hibernate.ddl-auto=none

# see queries in console (dev-only)
spring.jpa.show-sql=true

# Keep logs quiet (optional)
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn

# application.properties

# required ? your S3 bucket name
app.storage.bucket=your-bucket-name-here

# optional ? prefix/folder in the bucket (can be blank)
app.storage.prefix=election-vote-tracker


# --- Security / JWT issuer ---
app.security.issuer=https://vote-tracker.local

# --- AWS KMS signing (used by SigningServiceAwsKms) ---
# For now you can use a dummy key ID in local dev; in real prod, put actual KMS key ARN/ID
app.security.kms.key-id=local-dev-key-id
app.security.kms.algorithm=RSASSA_PSS_SHA_256

# --- Logging ---
logging.level.org.springframework.security=DEBUG


# Thymeleaf dev
spring.thymeleaf.cache=false

# Reports: use local filesystem storage for dev/testing
reports.storage=filesystem
reports.filesystem.path=./data/reports

# PDF defaults
reports.pdf.topN=10
reports.pdf.sampleSize=20

# S3 values left blank for dev; supply in prod via application-prod.properties or environment variables
reports.s3.endpoint=
reports.s3.region=us-east-1
reports.s3.accessKey=
reports.s3.secretKey=
reports.s3.bucket=
reports.s3.basePath=reports
reports.s3.presign.ttl=86400


# Production (application-prod.properties) ? enable S3 (do not commit secrets)

# Enable Thymeleaf cache in prod
#spring.thymeleaf.cache=true
#
## Use S3 for storage in production
#reports.storage=s3
