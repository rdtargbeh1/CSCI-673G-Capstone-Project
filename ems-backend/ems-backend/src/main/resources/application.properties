spring.application.name=ems-backend


# ================================================================
# POSTGRESQL DATASOURCE
# ================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/election_app_ems
spring.datasource.username=postgres
spring.datasource.password=romelta2
spring.datasource.driver-class-name=org.postgresql.Driver


# ================================================================
# DATASOURCE MODE
# ================================================================

# Local development currently uses the standard Spring Boot DataSource.
app.datasource.tenant-aware=false


# ================================================================
# JPA / HIBERNATE
# ================================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn
